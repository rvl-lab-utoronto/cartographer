syntax = "proto3";

import "cartographer/transform/proto/transform.proto";
import "cartographer/mapping/proto/motion_filter_options.proto";
import "cartographer/mapping/proto/local_trajectory_builder_options_2d.proto";
import "cartographer/mapping/proto/local_trajectory_builder_options_3d.proto";

package cartographer.mapping.proto;

message InitialTrajectoryPose {
  transform.proto.Rigid3d relative_pose = 1;
  int32 to_trajectory_id = 2;
  int64 timestamp = 3;
}

message TrajectoryBuilderOptions {
  LocalTrajectoryBuilderOptions2D trajectory_builder_2d_options = 1;
  LocalTrajectoryBuilderOptions3D trajectory_builder_3d_options = 2;
  InitialTrajectoryPose initial_trajectory_pose = 4;

  reserved 5;

  bool pure_localization = 3 [deprecated = true];
  message PureLocalizationTrimmerOptions {
    int32 max_submaps_to_keep = 1;

    // Fork (2026-09-21). Off-map retention. With keep_uncovered true the
    // trimmer spares an old live submap whose ground the FROZEN (loaded) map
    // does not already describe, so driving off the stored map behaves like
    // ordinary SLAM while driving on it stays pure localization.
    // Coverage is tested against a bitmap built ONCE from the frozen submaps
    // at coverage_resolution, sampled with a stride, and kept live submaps are
    // added to it so a second pass over the same new ground is still trimmed.
    // This is deliberately NOT OverlappingSubmapsTrimmer2D, which rebuilds a
    // std::map over every cell of every submap on every pass while holding the
    // pose graph mutex and wedges the node on a map this size.
    bool keep_uncovered = 2;
    // Metres per cell of that bitmap. Coarse on purpose: the question is
    // whether the ground is described at all, not where a wall is.
    double coverage_resolution = 3;
    // How far from previously-driven ground still counts as covered, in
    // metres. Coverage is taken from the FROZEN trajectories' node positions
    // dilated by this radius, which is a direct statement of "the robot has
    // been here before", and is what localization actually depends on.
    double coverage_radius = 4;
    // Dilation, in metres, applied when a KEPT live submap is folded into the
    // coverage. Decides "did this run already map this exact ground", so it
    // is a path width (3 m), not coverage_radius: with the large radius the
    // next consecutive submap was always redundant (bug, 2026-09-22).
    double keep_radius = 5;
  }
  PureLocalizationTrimmerOptions pure_localization_trimmer = 6;

  bool collate_fixed_frame = 7;
  bool collate_landmarks = 8;

  MotionFilterOptions pose_graph_odometry_motion_filter = 9;
}

message SensorId {
  enum SensorType {
    RANGE = 0;
    IMU = 1;
    ODOMETRY = 2;
    FIXED_FRAME_POSE = 3;
    LANDMARK = 4;
    LOCAL_SLAM_RESULT = 5;
  }

  SensorType type = 1;
  string id = 2;
}

message TrajectoryBuilderOptionsWithSensorIds {
  repeated SensorId sensor_id = 1;
  TrajectoryBuilderOptions trajectory_builder_options = 2;
}

message AllTrajectoryBuilderOptions {
  repeated TrajectoryBuilderOptionsWithSensorIds options_with_sensor_ids = 1;
}
